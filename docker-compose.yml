version: "3.8"
services:
  backend:
    build:
      context: ./API
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./front/copmed-extension
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  # precisa do instalador .jar em ./esus-pec 
  esus-pec:
    build:
      context: ./esus-pec
      dockerfile: Dockerfile
    image: esus-pec:5.5.28
    container_name: esus
    profiles: ["esus"]
    ports:
      - "8081:8080"
    mem_limit: 2560m
    volumes:
      - esus-pec-data:/opt/e-SUS/database/postgresql-9.6.13-1-linux-x64/data
    restart: unless-stopped

volumes:
  esus-pec-data:
