[pytest]
# `API/` e a raiz de importacao: torna `backend.*` e `server` resolviveis sem
# os imports relativos quebrados (`from ..backend import ...`) da versao antiga.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Os scripts manuais de audio em backend/processador_voz/ tem nome test_*.py
# mas exigem microfone e modelos Vosk - nao sao testes automatizados.
norecursedirs = backend/processador_voz .git .venv* __pycache__

addopts = -q --strict-markers
