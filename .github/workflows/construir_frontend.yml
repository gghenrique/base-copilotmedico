name: CI Frontend

# B11 (US012): lint, checagem de tipos e build da extensão e do sistema web.
# Os jobs abaixo são os checks exigidos pela proteção de develop e main
# (ver docs/07-equipe-processo.md, seção "Proteção de branches").

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "front/**"
      - ".github/workflows/construir_frontend.yml"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extensao:
    name: "Extensão (eslint, tsc, vite build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front/copmed-extension
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/copmed-extension/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint -- --max-warnings=0

      - name: Checagem de tipos (tsc)
        run: npx tsc -b

      - name: Build (vite)
        run: npx vite build

      - name: Compactar a pasta dist
        run: zip -r extension-dist.zip ./dist

      - name: Publicar a extensão como artefato
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist-package
          path: ./front/copmed-extension/extension-dist.zip
          retention-days: 7

  web:
    name: "Web copmed-web (eslint, vite build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front/copmed-web
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/copmed-web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint -- --max-warnings=0

      - name: Build (vite)
        run: npm run build
